<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match - Islamic Edition</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6c5ce7">
  
  <!-- Font Modern (Outfit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      --card-back: linear-gradient(135deg, #6c5ce7, #a29bfe);
      --card-front: rgba(255, 255, 255, 0.95);
      --accent-color: #fd79a8;
      --accent-yellow: #ffeaa7;
      --text-color: #ffffff;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Container Utama */
    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--glass-shadow);
      position: relative;
    }

    /* Screens */
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease-in-out;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Welcome Screen */
    .title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffeaa7, #fd79a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #dcdde1;
      margin-bottom: 24px;
    }

    .input-group {
      width: 100%;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: 2px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
      transition: all 0.3s;
    }

    .input-group input::placeholder {
      color: #b2bec3;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
      background: rgba(255, 255, 255, 0.25);
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #fd79a8, #e84393);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(232, 67, 147, 0.4);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(232, 67, 147, 0.6);
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* Leaderboard Box */
    .leaderboard-box {
      width: 100%;
      margin-top: 24px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      padding: 16px;
      max-height: 200px;
      overflow-y: auto;
    }

    .leaderboard-box h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--accent-yellow);
    }

    .leaderboard-list {
      list-style: none;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.9rem;
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    /* Game Screen */
    .game-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 16px;
      border-radius: 16px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #b2bec3;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-yellow);
    }

    .sound-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Grid 4x4 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .card {
      background: transparent;
      perspective: 1000px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Kartu Terbuka */
    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    /* Kartu Cocok: Tetap terbuka penuh tanpa efek transparan, tapi tidak bisa diklik */
    .card.matched {
      cursor: default;
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card-back {
      background: var(--card-back);
      border: 2px solid rgba(255, 255, 255, 0.3);
      font-size: 1.5rem;
    }

    .card-back::after {
      content: '✨';
      opacity: 0.6;
    }

    .card-front {
      background: var(--card-front);
      transform: rotateY(180deg);
      border: 2px solid #fff;
    }

    .card-icon {
      font-size: 2.2rem;
      line-height: 1;
      margin-bottom: 4px;
    }

    .card-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #2d3436;
    }

    /* Modal Hasil */
    .victory-box {
      background: rgba(0, 0, 0, 0.3);
      padding: 20px;
      border-radius: 16px;
      width: 100%;
      margin: 16px 0;
    }

    .victory-box p {
      margin: 8px 0;
      font-size: 1.1rem;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Screen 1: Welcome -->
    <div id="welcome-screen" class="screen active">
      <h1 class="title">Islamic Match</h1>
      <p class="subtitle">Asah ingatanmu dengan mencocokkan kartu 4x4!</p>
      
      <div class="input-group">
        <input type="text" id="player-name" placeholder="Masukkan Nama Kamu" maxlength="12">
      </div>

      <button class="btn" onclick="startGame()">Mulai Permainan</button>

      <div class="leaderboard-box">
        <h3>🏆 Papan Skor (Tercepat)</h3>
        <ul id="leaderboard-list" class="leaderboard-list">
          <li class="leaderboard-item"><span>Belum ada skor</span></li>
        </ul>
      </div>
    </div>

    <!-- Screen 2: Game Board -->
    <div id="game-screen" class="screen">
      <div class="game-header">
        <div class="stat-item">
          <span class="stat-label">Pemain</span>
          <span id="display-name" class="stat-value">User</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Waktu</span>
          <span id="timer" class="stat-value">00:00</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Langkah</span>
          <span id="moves" class="stat-value">0</span>
        </div>
        <button id="sound-toggle" class="sound-btn" onclick="toggleBGM()">🎵</button>
      </div>

      <div id="grid-container" class="grid-container"></div>
    </div>

    <!-- Screen 3: Victory -->
    <div id="victory-screen" class="screen">
      <h1 class="title">Masya Allah! 🎉</h1>
      <p class="subtitle">Kamu berhasil menyelesaikan semua kartu!</p>

      <div class="victory-box">
        <p>Waktu: <strong id="final-time" style="color:var(--accent-yellow)">-</strong></p>
        <p>Langkah: <strong id="final-moves" style="color:var(--accent-color)">-</strong></p>
      </div>

      <button class="btn" onclick="resetToWelcome()">Main Lagi</button>
    </div>

  </div>

  <script>
    // 8 Pasang Kartu (4x4 Grid)
    const cardItems = [
      { name: "Masjid", icon: "🕌" },
      { name: "Ka'bah", icon: "🕋" },
      { name: "Do'a", icon: "🤲" },
      { name: "Bulan", icon: "🌙" },
      { name: "Tasbih", icon: "📿" },
      { name: "Muslimah", icon: "🧕" },
      { name: "Kurma", icon: "🌴" },
      { name: "Al-Qur'an", icon: "📖" }
    ];

    let playerName = "";
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let timerInterval = null;
    let secondsElapsed = 0;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    let audioCtx = null;
    let isMuted = false;

    function initBGM() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playCcheerfulNote() {
      if (isMuted || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const notes = [261.63, 329.63, 392.00, 523.25];
        const randomNote = notes[Math.floor(Math.random() * notes.length)];
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(randomNote, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } catch(e){}
    }

    function toggleBGM() {
      isMuted = !isMuted;
      document.getElementById('sound-toggle').innerText = isMuted ? '🔇' : '🎵';
    }

    function updateLeaderboardUI() {
      const leaderboard = JSON.parse(localStorage.getItem('memory_game_scores') || '[]');
      const listEl = document.getElementById('leaderboard-list');
      
      if (leaderboard.length === 0) {
        listEl.innerHTML = '<li class="leaderboard-item"><span>Belum ada skor</span></li>';
        return;
      }

      listEl.innerHTML = leaderboard.slice(0, 5).map((item, index) => `
        <li class="leaderboard-item">
          <span><strong>#${index + 1}</strong> ${escapeHtml(item.name)}</span>
          <span>⏱️ ${item.timeStr} (${item.moves} m)</span>
        </li>
      `).join('');
    }

    function saveScore(timeStr, seconds, movesCount) {
      let leaderboard = JSON.parse(localStorage.getItem('memory_game_scores') || '[]');
      leaderboard.push({ name: playerName, timeStr, seconds, moves: movesCount });
      leaderboard.sort((a, b) => a.seconds - b.seconds || a.moves - b.moves);
      localStorage.setItem('memory_game_scores', JSON.stringify(leaderboard));
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function startGame() {
      const input = document.getElementById('player-name');
      playerName = input.value.trim() || 'Pemain';
      document.getElementById('display-name').innerText = playerName;

      initBGM();

      document.getElementById('welcome-screen').classList.remove('active');
      document.getElementById('game-screen').classList.add('active');

      setupBoard();
    }

    function setupBoard() {
      const deck = [...cardItems, ...cardItems];
      deck.sort(() => Math.random() - 0.5);

      const gridContainer = document.getElementById('grid-container');
      gridContainer.innerHTML = '';

      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      secondsElapsed = 0;
      document.getElementById('moves').innerText = '0';
      document.getElementById('timer').innerText = '00:00';

      clearInterval(timerInterval);
      timerInterval = setInterval(updateTimer, 1000);

      deck.forEach((item, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.name = item.name;
        card.dataset.index = index;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-back"></div>
            <div class="card-front">
              <span class="card-icon">${item.icon}</span>
              <span class="card-label">${item.name}</span>
            </div>
          </div>
        `;

        card.addEventListener('click', () => flipCard(card));
        gridContainer.appendChild(card);
      });
    }

    function flipCard(card) {
      if (flippedCards.length === 2 || card.classList.contains('flipped') || card.classList.contains('matched')) {
        return;
      }

      playCcheerfulNote();
      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moves').innerText = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.name === card2.dataset.name;

      if (isMatch) {
        card1.classList.add('matched');
        card2.classList.add('matched');
        matchedPairs++;
        flippedCards = [];

        if (matchedPairs === cardItems.length) {
          endGame();
        }
      } else {
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
        }, 800);
      }
    }

    function updateTimer() {
      secondsElapsed++;
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${mins}:${secs}`;
    }

    function endGame() {
      clearInterval(timerInterval);
      const finalTimeStr = document.getElementById('timer').innerText;
      
      saveScore(finalTimeStr, secondsElapsed, moves);

      document.getElementById('final-time').innerText = finalTimeStr;
      document.getElementById('final-moves').innerText = moves;

      setTimeout(() => {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('victory-screen').classList.add('active');
      }, 600);
    }

    function resetToWelcome() {
      updateLeaderboardUI();
      document.getElementById('victory-screen').classList.remove('active');
      document.getElementById('welcome-screen').classList.add('active');
    }

    updateLeaderboardUI();
  </script>
</body>
</html>
