<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Islamic Memory Match</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF80AB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', sans-serif;
      background: linear-gradient(135deg, #FFD1DC, #80DEEA, #B39DDB);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Modal Popups */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 24px 30px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 4px solid #FF4081;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal h2 {
      color: #E91E63;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    .modal input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1.1rem;
      border: 3px solid #80DEEA;
      border-radius: 12px;
      outline: none;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
      color: #00838F;
    }

    .modal input:focus {
      border-color: #FF4081;
    }

    /* Container Header & Controls */
    header {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .title-box {
      background: white;
      padding: 6px 16px;
      border-radius: 20px;
      border: 3px solid #FF4081;
      color: #C2185B;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .stats-bar {
      display: flex;
      gap: 10px;
      background: white;
      padding: 6px 14px;
      border-radius: 20px;
      border: 3px solid #00BCD4;
      font-weight: bold;
      font-size: 0.95rem;
      color: #00838F;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    /* Grid Layout: 4 cols x 5 rows */
    .grid-container {
      width: 100%;
      max-width: 460px;
      height: 72vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      height: 100%;
      perspective: 1000px;
    }

    /* Square Card Styles */
    .card {
      background-color: transparent;
      aspect-ratio: 1 / 1;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      box-shadow: 0 4px 8px rgba(0,0,0,0.12);
      border-radius: 16px;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Front Cover Card (Pink Theme) */
    .card-front {
      background: linear-gradient(135deg, #FF80AB, #FF4081);
      color: white;
      font-size: 2rem;
      border: 3px solid #FFFFFF;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
    }

    .card-front::after {
      content: '🕌';
      font-size: 1.8rem;
    }

    /* Back Revealed Face (Cyan/Blue Theme) */
    .card-back {
      background: #E0F7FA;
      transform: rotateY(180deg);
      border: 3px solid #00BCD4;
      padding: 4px;
    }

    .card-back .icon {
      font-size: 2.2rem;
      line-height: 1.1;
    }

    .card-back .label {
      font-size: 0.75rem;
      font-weight: bold;
      color: #006064;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Footer Buttons */
    footer {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }

    button.btn {
      background: linear-gradient(135deg, #FF4081, #E91E63);
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(233, 30, 99, 0.3);
      transition: all 0.2s;
    }

    button.btn-blue {
      background: linear-gradient(135deg, #00BCD4, #0097A7);
      box-shadow: 0 4px 10px rgba(0, 188, 212, 0.3);
    }

    button.btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .icon-btn {
      background: white;
      border: 2px solid #FF4081;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Leaderboard Table */
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      font-size: 0.95rem;
    }

    .leaderboard-table th {
      background-color: #FF80AB;
      color: white;
      padding: 8px;
      border-radius: 8px 8px 0 0;
    }

    .leaderboard-table td {
      padding: 8px;
      border-bottom: 1px solid #E0E0E0;
      color: #333;
    }

    .leaderboard-table tr:nth-child(even) {
      background-color: #FCE4EC;
    }

    .empty-lb {
      color: #888;
      font-style: italic;
      padding: 15px 0;
    }

    @media (max-height: 600px) {
      .card-back .icon { font-size: 1.6rem; }
      .card-back .label { font-size: 0.65rem; }
      .card-front::after { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <!-- Modal Name Input -->
  <div id="name-modal" class="modal">
    <div class="modal-content">
      <h2>🌸 Selamat Datang! 🌸</h2>
      <p style="color: #666; margin-bottom: 15px;">Masukkan namamu untuk mulai bermain:</p>
      <input type="text" id="player-name-input" placeholder="Nama Pemain..." maxlength="12">
      <button class="btn" onclick="startGameWithPlayer()">Mulai Bermain! 🚀</button>
    </div>
  </div>

  <!-- Modal Leaderboard / GameOver -->
  <div id="leaderboard-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2 id="lb-title">🏆 Papan Skor 🏆</h2>
      <div id="game-summary" style="display: none; margin-bottom: 10px; background: #E0F7FA; padding: 10px; border-radius: 12px; color: #00838F; font-weight: bold;"></div>
      
      <div style="max-height: 220px; overflow-y: auto;">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Nama</th>
              <th>Langkah</th>
              <th>Waktu</th>
            </tr>
          </thead>
          <tbody id="lb-body"></tbody>
        </table>
      </div>

      <div style="display: flex; gap: 8px; justify-content: center; margin-top: 15px;">
        <button class="btn btn-blue" onclick="playAgainSamePlayer()">🔄 Main Lagi</button>
        <button class="btn" onclick="changePlayer()">👤 Ganti Pemain</button>
      </div>
    </div>
  </div>

  <header>
    <div class="title-box">🕌 Memory Islamic</div>
    <div class="stats-bar">
      <span>👤 <span id="current-player-name">-</span></span>
      <span>👣 <span id="moves-count">0</span></span>
      <span>⏱️ <span id="timer-display">0s</span></span>
    </div>
  </header>

  <div class="grid-container">
    <div class="grid" id="grid"></div>
  </div>

  <footer>
    <button class="btn" onclick="showLeaderboardModal()">🏆 Skor</button>
    <button class="btn btn-blue" onclick="restartCurrentGame()">🔄 Reset</button>
    <button class="icon-btn" id="bgm-btn" onclick="toggleBGM()">🎵</button>
    <button class="icon-btn" onclick="toggleFullScreen()">📺</button>
  </footer>

  <script>
    // 10 Pasang Kartu (4x5 = 20 Kartu Total)
    const items = [
      { icon: '🕌', label: 'Masjid' },
      { icon: '📖', label: 'Al-Qur\'an' },
      { icon: '🌙', label: 'Bulan' },
      { icon: '📿', label: 'Tasbih' },
      { icon: '🕋', label: 'Ka\'bah' },
      { icon: '🌴', label: 'Kurma' },
      { icon: '💧', label: 'Wudhu' },
      { icon: '✨', label: 'Sedekah' },
      { icon: '🕌', label: 'Kubah', iconOverride: '🕌' },
      { icon: '⭐', label: 'Bintang' }
    ];

    let playerName = "";
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let seconds = 0;
    let timerInterval = null;
    let canFlip = true;
    let bgmMuted = false;

    // Web Audio API Synth Engine (BGM & SFX tanpa file eksternal)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let bgmInterval = null;

    const bgmMelody = [
      { note: 523.25, duration: 0.2 }, // C5
      { note: 659.25, duration: 0.2 }, // E5
      { note: 783.99, duration: 0.2 }, // G5
      { note: 1046.50, duration: 0.3 },// C6
      { note: 880.00, duration: 0.2 }, // A5
      { note: 783.99, duration: 0.2 }, // G5
      { note: 659.25, duration: 0.3 }, // E5
      { note: 587.33, duration: 0.2 }, // D5
      { note: 659.25, duration: 0.2 }, // E5
      { note: 698.46, duration: 0.2 }, // F5
      { note: 783.99, duration: 0.4 }, // G5
    ];

    function playBGM() {
      if (bgmInterval || bgmMuted) return;
      let step = 0;

      bgmInterval = setInterval(() => {
        if (bgmMuted) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const currentNote = bgmMelody[step];
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(currentNote.note, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + currentNote.duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + currentNote.duration);

        step = (step + 1) % bgmMelody.length;
      }, 350);
    }

    function stopBGM() {
      if (bgmInterval) {
        clearInterval(bgmInterval);
        bgmInterval = null;
      }
    }

    function toggleBGM() {
      bgmMuted = !bgmMuted;
      const btn = document.getElementById('bgm-btn');
      if (bgmMuted) {
        stopBGM();
        btn.innerText = '🔇';
      } else {
        btn.innerText = '🎵';
        playBGM();
      }
    }

    function playSFX(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'flip') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.06);
      } else if (type === 'match') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
        osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'win') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
          g.gain.setValueAtTime(0.15, audioCtx.currentTime + idx * 0.1);
          o.connect(g);
          g.connect(audioCtx.destination);
          o.start(audioCtx.currentTime + idx * 0.1);
          o.stop(audioCtx.currentTime + idx * 0.1 + 0.2);
        });
      }
    }

    function startGameWithPlayer() {
      const input = document.getElementById('player-name-input');
      const val = input.value.trim();
      if (!val) {
        alert('Silakan masukkan nama terlebih dahulu ya!');
        return;
      }
      playerName = val;
      document.getElementById('current-player-name').innerText = playerName;
      document.getElementById('name-modal').style.display = 'none';
      
      playBGM();
      initGame();
    }

    function changePlayer() {
      document.getElementById('leaderboard-modal').style.display = 'none';
      document.getElementById('player-name-input').value = '';
      document.getElementById('name-modal').style.display = 'flex';
      stopTimer();
    }

    function playAgainSamePlayer() {
      document.getElementById('leaderboard-modal').style.display = 'none';
      initGame();
    }

    function restartCurrentGame() {
      initGame();
    }

    function startTimer() {
      stopTimer();
      seconds = 0;
      document.getElementById('timer-display').innerText = '0s';
      timerInterval = setInterval(() => {
        seconds++;
        document.getElementById('timer-display').innerText = seconds + 's';
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function initGame() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      canFlip = true;
      document.getElementById('moves-count').innerText = '0';

      startTimer();

      const deck = [...items, ...items]
        .map((item, index) => ({ ...item, uniqueId: index }))
        .sort(() => Math.random() - 0.5);

      deck.forEach((data) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.label = data.label;

        card.innerHTML = `
          <div class="card-inner">
            <div class="card-front"></div>
            <div class="card-back">
              <div class="icon">${data.iconOverride || data.icon}</div>
              <div class="label">${data.label}</div>
            </div>
          </div>
        `;
        card.addEventListener('click', () => flipCard(card));
        grid.appendChild(card);
      });
    }

    function flipCard(card) {
      if (!canFlip || card.classList.contains('flipped') || flippedCards.includes(card)) return;

      playSFX('flip');
      card.classList.add('flipped');
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moves-count').innerText = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      canFlip = false;
      const [card1, card2] = flippedCards;

      if (card1.dataset.label === card2.dataset.label) {
        playSFX('match');
        matchedPairs++;
        flippedCards = [];
        canFlip = true;

        if (matchedPairs === items.length) {
          stopTimer();
          playSFX('win');
          setTimeout(() => {
            saveScore(playerName, moves, seconds);
            showLeaderboardModal(true);
          }, 600);
        }
      } else {
        playSFX('wrong');
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          flippedCards = [];
          canFlip = true;
        }, 900);
      }
    }

    function saveScore(name, moves, time) {
      let scores = JSON.parse(localStorage.getItem('islamic_memory_scores') || '[]');
      scores.push({ name, moves, time });
      scores.sort((a, b) => a.moves - b.moves || a.time - b.time);
      scores = scores.slice(0, 10);
      localStorage.setItem('islamic_memory_scores', JSON.stringify(scores));
    }

    function showLeaderboardModal(isGameOver = false) {
      const modal = document.getElementById('leaderboard-modal');
      const title = document.getElementById('lb-title');
      const summary = document.getElementById('game-summary');
      const tbody = document.getElementById('lb-body');

      if (isGameOver) {
        title.innerText = "🎉 MasyaAllah! Menang! 🎉";
        summary.style.display = 'block';
        summary.innerHTML = `Hebat ${playerName}!<br>Langkah: ${moves} | Waktu: ${seconds} detik`;
      } else {
        title.innerText = "🏆 Papan Skor 🏆";
        summary.style.display = 'none';
      }

      const scores = JSON.parse(localStorage.getItem('islamic_memory_scores') || '[]');
      tbody.innerHTML = '';

      if (scores.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-lb">Belum ada skor tersimpan. Yuk main!</td></tr>';
      } else {
        scores.forEach((s, i) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>${i + 1}</b></td>
            <td>${s.name}</td>
            <td>${s.moves}</td>
            <td>${s.time}s</td>
          `;
          tbody.appendChild(tr);
        });
      }

      modal.style.display = 'flex';
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
